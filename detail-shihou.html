<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鏂瑰煄鐭抽洉鐚?- 鏂瑰煄鐧剧弽鍧?/title>
<style>
:root{--primary:#171411;--accent:#B9975B;--bg:#F6F0E6;--text:#2b241e;--muted:#766D61;--clay:#A85F3D;--pine:#596C58;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1,'lnum' 1;}
.header{background:var(--primary);padding:0 32px;box-shadow:0 2px 12px rgba(0,0,0,0.15);position:sticky;top:0;z-index:1000;}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#b89b5b,#d4b876);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--primary);}
.logo-title{font-size:20px;font-weight:700;color:#fff;letter-spacing:2px;}
.back-btn{color:rgba(255,255,255,0.7);text-decoration:none;font-size:14px;display:flex;align-items:center;gap:6px;transition:color .3s;}
.back-btn:hover{color:#d4b876;}

/* ============ 澶у浘灞曠ず鍖?============ */
.gallery{background:#1a1a2e;padding:24px 24px 0;}
.gallery-inner{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr;gap:16px;}
.gallery-main{width:100%;aspect-ratio:4/3;border-radius:12px;background-size:cover;background-position:center;cursor:pointer;transition:transform .3s;}
.gallery-main:hover{transform:scale(1.01);}
.gallery-thumbs{display:flex;flex-direction:column;gap:12px;}
.thumb{width:100%;flex:1;border-radius:8px;background-size:cover;background-position:center;cursor:pointer;opacity:.7;transition:all .3s;border:2px solid transparent;}
.thumb:hover,.thumb.active{opacity:1;border-color:var(--accent);}

/* ============ 鍟嗗搧淇℃伅鍖?============ */
.info-wrap{max-width:900px;margin:0 auto;padding:32px 24px 16px;}
.breadcrumb{font-size:13px;color:var(--muted);margin-bottom:20px;}
.breadcrumb a{color:var(--muted);text-decoration:none;transition:color .3s;}
.breadcrumb a:hover{color:var(--primary);}

.product-title{font-size:30px;font-weight:700;color:var(--primary);margin-bottom:8px;letter-spacing:2px;}
.product-subtitle{font-size:14px;color:var(--muted);margin-bottom:20px;}

/* ============ 浠嬬粛鍖?============ */
.desc-section{max-width:900px;margin:0 auto;padding:0 24px 24px;}
.desc-title{font-size:18px;font-weight:700;color:var(--primary);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.desc-title::before{content:'';width:4px;height:18px;background:var(--accent);border-radius:2px;}
.desc-content{font-size:15px;line-height:2.2;color:#555;}
.desc-content p{margin-bottom:12px;text-indent:2em;}
.highlight-box{background:rgba(184,155,91,0.08);border-left:3px solid var(--accent);padding:16px 20px;border-radius:0 8px 8px 0;margin:20px 0;font-size:14px;color:#666;line-height:1.8;}

/* ============ 灞炴€у尯锛堝搧绫?鍖呰绛夛級 ============ */
.attr-section{max-width:900px;margin:0 auto;padding:0 24px 32px;}
.attr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.attr-card{background:#fff;border:1px solid #e8e4de;border-radius:12px;padding:18px;text-align:center;transition:all .3s;}
.attr-card:hover{box-shadow:0 4px 12px rgba(26,60,110,0.06);border-color:var(--accent);}
.attr-icon{font-size:22px;margin-bottom:6px;}
.attr-label{font-size:12px;color:var(--muted);margin-bottom:4px;}
.attr-value{font-size:14px;font-weight:600;color:var(--text);}

/* ============ 鍒嗗壊绾?============ */
.section-divider{max-width:900px;margin:0 auto;padding:0 24px;}
.section-divider hr{border:none;height:1px;background:linear-gradient(90deg,transparent,#e0dcd6,transparent);}

/* ============ CTA鎸夐挳 ============ */
.cta-bar{max-width:900px;margin:0 auto;padding:24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.btn-buy{background:linear-gradient(135deg,#b89b5b,#d4b876);color:#fff;border:none;border-radius:10px;padding:14px 48px;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s;}
.btn-buy:hover{box-shadow:0 4px 16px rgba(184,155,91,0.4);transform:translateY(-2px);}
.btn-fav{background:#f8f8f8;border:1px solid #e0dcd6;color:var(--text);border-radius:10px;padding:14px 24px;font-size:14px;font-weight:500;cursor:pointer;transition:all .3s;}
.btn-fav:hover{border-color:var(--accent);color:var(--accent);}

/* ============ 鐭崇尨绯诲垪婊氬姩鏉?============ */
.sh-section{background:linear-gradient(180deg,#f0ece5,var(--bg));padding:32px 0 24px;margin-top:24px;}
.sh-title{max-width:1200px;margin:0 auto;padding:0 24px 16px;font-size:20px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:10px;}
.sh-title::before{content:'';width:4px;height:20px;background:var(--accent);border-radius:2px;}
.marquee-wrap{overflow:hidden;position:relative;background:rgba(255,255,255,0.5);padding:20px 0;border-top:1px solid #e0dcd6;border-bottom:1px solid #e0dcd6;}
.sh-track{display:flex;gap:24px;width:max-content;animation:shihouMarquee 45s linear infinite;}
.marquee-wrap:hover .sh-track{animation-play-state:paused;}
.sh-card{flex-shrink:0;width:180px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e0dcd4;text-decoration:none;color:var(--text);transition:all .3s;box-shadow:0 2px 8px rgba(0,0,0,0.06);cursor:pointer;}
.sh-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,0.12);}
.sh-img{width:100%;height:140px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:64px;}
.sh-body{padding:12px;}
.sh-code{font-size:11px;color:var(--muted);margin-bottom:4px;}
.sh-name{font-size:13px;font-weight:600;line-height:1.4;}
.sh-price{font-size:16px;font-weight:700;color:var(--accent);margin-top:6px;}
.sh-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:12px;}
@keyframes shihouMarquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ============ 鐚滀綘鍠滄 ============ */
.rec-section{max-width:900px;margin:0 auto;padding:32px 24px 48px;}
.rec-title{font-size:18px;font-weight:700;color:var(--primary);margin-bottom:20px;display:flex;align-items:center;gap:10px;}
.rec-title::before{content:'';width:4px;height:18px;background:var(--accent);border-radius:2px;}
.rec-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.rec-card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e8e4de;text-decoration:none;color:var(--text);transition:all .3s;}
.rec-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(26,60,110,0.12);}
.rec-img{width:100%;padding-top:75%;background-size:cover;background-position:center;}
.rec-body{padding:12px;}
.rec-name{font-size:13px;font-weight:600;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.rec-price{font-size:15px;font-weight:700;color:var(--accent);margin-top:6px;}

@media(max-width:768px){
  .gallery-inner{grid-template-columns:1fr;}
  .gallery-thumbs{flex-direction:row;height:80px;}
  .product-title{font-size:22px;}
  .attr-grid{grid-template-columns:repeat(2,1fr);}
  .rec-grid{grid-template-columns:repeat(2,1fr);}
}

/* ============ 渚ц竟鏍忓鑸?============ */
.side-tab.active{background:var(--primary)!important;color:#fff!important;}
.side-tab.active:hover{background:var(--primary)!important;}
.tab-content{display:none;animation:fadeIn .5s ease;}
.tab-content.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    .shell { width: min(1240px, calc(100vw - 48px)); margin: 0 auto; }

      position: sticky;

      top: 0;

      z-index: 60;

      min-height: 76px;

    }

    }

    .profile-close {

      height: 32px;

    .profile-user-block {

      display: flex;

      align-items: center;

      gap: 12px;

      border-bottom: 1px solid rgba(185,151,91,.1);

    }

    .profile-avatar-large {

      width: 80px;

      height: 80px;

      border-radius: 50%;

      border: 2px solid rgba(185,151,91,.5);

      overflow: hidden;

      background: rgba(185,151,91,.15);

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      position: relative;

    }

    .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; }

    .profile-avatar-large:hover::after {

      content: "更换头像";

      inset: 0;

      background: rgba(23,20,17,.6);

      display: flex;

      align-items: center;

      color: var(--gold);

      font-size: 12px;

      border-radius: 50%;

    }

    .profile-username {

      color: var(--cream);

      font-size: 16px;

      letter-spacing: 2px;

      font-weight: 700;

    }

    .profile-tag {

      color: rgba(255,249,237,.42);

      font-size: 12px;

      letter-spacing: 2px;

    }

    .profile-upload-input { display: none; }

    .profile-menu {

      display: flex;

      flex-direction: column;

      padding: 16px 0;

    }

    .profile-menu a {

      display: flex;

      align-items: center;

      gap: 14px;

      padding: 14px 24px;

      color: rgba(255,249,237,.7);

      font-size: 14px;

      transition: background .2s, color .2s;

      text-decoration: none;

    }

    .profile-menu a:hover {

      background: rgba(185,151,91,.08);

      color: var(--gold);

      border-left-color: var(--gold);

    }

    .profile-menu a svg { opacity: .6; flex-shrink: 0; }



    /* 账户子面板 */

    }

    .profile-panel-back:hover { color: var(--gold); }

      margin: 20px 20px 0;

    }

<script>
    (function() {
      const overlay = document.getElementById('profileOverlay');
      const sidebar = document.getElementById('profileSidebar');
      const navAvatar = document.getElementById('navAvatar');
      const closeBtn = document.getElementById('profileClose');
      const avatarUpload = document.getElementById('avatarUpload');
      const navAvatarImg = document.getElementById('navAvatarImg');
      const navAvatarIcon = document.getElementById('navAvatarIcon');
      const sidebarAvatarImg = document.getElementById('sidebarAvatarImg');
      const sidebarAvatarIcon = document.getElementById('sidebarAvatarIcon');

      function openSidebar() {
        overlay.classList.add('open');
        sidebar.classList.add('open');
      }
      function closeSidebar() {
        overlay.classList.remove('open');
        sidebar.classList.remove('open');
      }

      navAvatar.addEventListener('click', openSidebar);
      navAvatar.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openSidebar(); });
      closeBtn.addEventListener('click', closeSidebar);
      overlay.addEventListener('click', closeSidebar);

      // 头像上传
      avatarUpload.addEventListener('change', function() {
        const file = this.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
          const src = e.target.result;
          // 更新导航头像
          navAvatarImg.src = src;
          navAvatarImg.style.display = 'block';
          navAvatarIcon.style.display = 'none';
          // 更新侧边栏头像
          sidebarAvatarImg.src = src;
          sidebarAvatarImg.style.display = 'block';
          sidebarAvatarIcon.style.display = 'none';
          // 本地持久化
          try { localStorage.setItem('baizhenfang_avatar', src); } catch(e) {}
        };
        reader.readAsDataURL(file);
      });

      // 恢复已保存头像
      try {
        const saved = localStorage.getItem('baizhenfang_avatar');
        if (saved) {
          navAvatarImg.src = saved;
          navAvatarImg.style.display = 'block';
          navAvatarIcon.style.display = 'none';
          sidebarAvatarImg.src = saved;
          sidebarAvatarImg.style.display = 'block';
          sidebarAvatarIcon.style.display = 'none';
        }
      } catch(e) {}

      // 面板切换
      const panelMain = document.getElementById('panelMain');
      const panelAccount = document.getElementById('panelAccount');
      const panelOrders = document.getElementById('panelOrders');
      const menuAccount = document.getElementById('menuAccount');
      const menuOrders = document.getElementById('menuOrders');
      const accountBack = document.getElementById('accountBack');
      const ordersBack = document.getElementById('ordersBack');

      function showPanel(panel) {
        panelMain.classList.remove('active');
        panelAccount.classList.remove('active');
        panelOrders.classList.remove('active');
        panel.classList.add('active');
      }

      menuAccount.addEventListener('click', function(e) { e.preventDefault(); showPanel(panelAccount); });
      menuOrders.addEventListener('click', function(e) { e.preventDefault(); showPanel(panelOrders); });
      accountBack.addEventListener('click', function() { showPanel(panelMain); });
      ordersBack.addEventListener('click', function() { showPanel(panelMain); });

      // 关闭时重置到主面板
      function closeSidebarFull() {
        overlay.classList.remove('open');
        sidebar.classList.remove('open');
        setTimeout(() => showPanel(panelMain), 350);
      }
      closeBtn.removeEventListener('click', closeSidebar);
      overlay.removeEventListener('click', closeSidebar);
      closeBtn.addEventListener('click', closeSidebarFull);
      overlay.addEventListener('click', closeSidebarFull);

      // 余额与充值
      const balanceNum = document.getElementById('balanceNum');
      const topupCustom = document.getElementById('topupCustom');
      const topupConfirm = document.getElementById('topupConfirm');
      const topupBtns = document.querySelectorAll('.topup-btn');

      let balance = 0;
      try { balance = parseFloat(localStorage.getItem('baizhenfang_balance') || '0'); } catch(e) {}
      balanceNum.textContent = balance.toFixed(2);

      let selectedAmount = 0;
      topupBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          topupBtns.forEach(b => b.classList.remove('selected'));
          this.classList.add('selected');
          selectedAmount = parseFloat(this.dataset.val);
          topupCustom.value = '';
        });
      });
      topupCustom.addEventListener('input', function() {
        topupBtns.forEach(b => b.classList.remove('selected'));
        selectedAmount = 0;
      });

      topupConfirm.addEventListener('click', function() {
        const custom = parseFloat(topupCustom.value);
        const amount = custom > 0 ? custom : selectedAmount;
        if (!amount || amount <= 0) return;
        balance += amount;
        balanceNum.textContent = balance.toFixed(2);
        try { localStorage.setItem('baizhenfang_balance', balance.toString()); } catch(e) {}
        topupBtns.forEach(b => b.classList.remove('selected'));
        topupCustom.value = '';
        selectedAmount = 0;
        topupConfirm.textContent = '充值成功 ✓';
        setTimeout(() => { topupConfirm.textContent = '确认充值'; }, 1500);
      });
    })();
  </script>
